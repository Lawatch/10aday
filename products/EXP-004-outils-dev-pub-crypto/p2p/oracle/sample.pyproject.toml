[tool.poetry]
name = "my-app"
version = "0.3.1"
description = "Demo" # comment

[tool.poetry.dependencies]
python = "^3.9"
requests = "^2.31"
"ruamel.yaml" = { version = ">=0.17", python = "<3.13" }
django = {extras = ["bcrypt"], version = "~4.2"}
pywin32 = { version = "^306", platform = "win32" }
foo = [
    { version = "<=1.9", python = ">=3.6,<3.8" },
    { version = "^2.0", python = "^3.8" },
]
mylib = { git = "https://github.com/org/mylib.git", rev = "a1b2c3d" }
local = { path = "../local", develop = true }
psycopg = { version = "^3.1", optional = true, extras = ['binary'] }
legacy = "^1.2 || ^2.0"

[tool.poetry.extras]
pg = ["psycopg"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = '>=0.4'

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "~1.6"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
